<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S5 Study Vault — Premium Flipbook Library</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/pdf.js"></script>
    <link rel="stylesheet" href="js/pdf_viewer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-book-open"></i>
                    <span class="logo-text">S5 Study Vault</span>
                </div>
                <div class="header-tags">
                    <span class="tag">FLSH Mohammedia</span>
                    <span class="tag">Semestre 5 • Group 2</span>
                </div>
            </div>
        </header>

        <main class="library-main">
            <div class="library-intro">
                <h1>Interactive Study Materials</h1>
                <p class="subtitle">Premium flipbook viewer — GPU-accelerated, physics-based page turning for mobile and desktop</p>
            </div>

            <div id="library-grid" class="library-grid">
                <!-- Book cards injected from data/books.json -->
            </div>
        </main>

        <footer class="app-footer">
            <p>Powered by Picporn • Auto-generated gallery • © 2026</p>
        </footer>
    </div>

    <!-- Flipbook Viewer Modal -->
    <div id="flipbook-modal" class="modal-overlay hidden">
        <div class="flipbook-container">
            <div class="flipbook-header">
                <h3 id="flipbook-title"></h3>
                <div class="flipbook-controls">
                    <button class="control-btn" id="prev-page"><i class="fas fa-chevron-left"></i></button>
                    <span class="page-info"><span id="current-page">1</span> / <span id="total-pages">1</span></span>
                    <button class="control-btn" id="next-page"><i class="fas fa-chevron-right"></i></button>
                    <button class="control-btn" id="zoom-in"><i class="fas fa-search-plus"></i></button>
                    <button class="control-btn" id="zoom-out"><i class="fas fa-search-minus"></i></button>
                    <button class="control-btn" id="close-flipbook"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="flipbook-wrapper" id="flipbook-wrapper">
                <canvas id="pdf-canvas"></canvas>
            </div>
            <div class="page-navigation">
                <input type="range" id="page-slider" min="1" max="1" value="1">
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

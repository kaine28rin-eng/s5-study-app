<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLSHM S5 • Literature Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff4b2b;
      --accent-grad: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      padding: 20px 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header { margin-bottom: 20px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: var(--accent-grad);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.6px; }
    p.sub { font-size: 14px; color: var(--text-sub); margin-top: 4px; line-height: 1.4; }

    .search-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    .search-box:focus { border-color: rgba(255, 75, 43, 0.5); }

    .grid { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .card:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.08); }
    .card-left { display: flex; align-items: center; gap: 14px; }
    .icon-box {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .title { font-size: 15px; font-weight: 600; }
    .count { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
    .arrow { color: #64748b; font-size: 16px; font-weight: 700; }

    #detailView {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 100; padding: 20px 16px;
      display: none; overflow-y: auto;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; margin-bottom: 20px;
    }
    .file-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .file-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      text-transform: uppercase;
      font-weight: 600;
    }
    .get-btn {
      background: var(--accent-grad);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="mainView">
    <header class="header">
      <div class="badge">FLSHM Semester 5</div>
      <h1>Literature Library</h1>
      <p class="sub">Verified lecture summaries, novels, & exam archives.</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="Search module or material..." oninput="filterModules()" />

    <div class="grid" id="modulesList"></div>
  </div>

  <div id="detailView">
    <button class="back-btn" onclick="closeDetails()">← Back to Modules</button>
    <header class="header">
      <h1 id="modTitle">Module Title</h1>
      <p class="sub" id="modSubtitle">Verified resources</p>
    </header>
    <div class="grid" id="lessonsList"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Static catalog data for instant rendering without backend dependencies
    const S5_MODULES = [
      {
        slug: "critical_theory",
        name: "Critical Theory",
        icon: "🧠",
        files: [
          { name: "Structuralism & Post-Structuralism Overview.pdf", tag: "notes", size: "1.4 MB" },
          { name: "Marxist & Psychoanalytic Criticism.pdf", tag: "summary", size: "890 KB" },
          { name: "Critical Theory Fall 2024 Exam.pdf", tag: "exam", size: "320 KB" }
        ]
      },
      {
        slug: "19th_century_novel",
        name: "19th-Century Novel",
        icon: "📖",
        files: [
          { name: "Great Expectations - Themes & Characters.pdf", tag: "notes", size: "2.1 MB" },
          { name: "Jane Eyre Analytical Breakdown.pdf", tag: "summary", size: "1.1 MB" },
          { name: "Victorian Industrial Novel Exam Questions.pdf", tag: "exam", size: "450 KB" }
        ]
      },
      {
        slug: "shakespeare_drama",
        name: "Shakespeare & Drama",
        icon: "🎭",
        files: [
          { name: "Hamlet Soliloquies Analysis.pdf", tag: "notes", size: "1.8 MB" },
          { name: "Elizabethan Theater Conventions.pdf", tag: "summary", size: "740 KB" },
          { name: "Shakespeare Drama Mock Final.pdf", tag: "exam", size: "390 KB" }
        ]
      },
      {
        slug: "romantic_poetry",
        name: "Romantic & Victorian Poetry",
        icon: "📜",
        files: [
          { name: "Wordsworth & Coleridge Romanticism.pdf", tag: "notes", size: "1.6 MB" },
          { name: "Victorian Poetic Forms & Tennyson.pdf", tag: "summary", size: "950 KB" },
          { name: "Poetry Past Midterms.pdf", tag: "exam", size: "510 KB" }
        ]
      },
      {
        slug: "postcolonial_lit",
        name: "Postcolonial Literature",
        icon: "🌍",
        files: [
          { name: "Edward Said - Orientalism Core Notes.pdf", tag: "notes", size: "2.3 MB" },
          { name: "Things Fall Apart Critical Review.pdf", tag: "summary", size: "1.2 MB" },
          { name: "Postcolonial Final Exam Collection.pdf", tag: "exam", size: "620 KB" }
        ]
      },
      {
        slug: "research_methodology",
        name: "Research Methodology",
        icon: "🔬",
        files: [
          { name: "MLA 9th Edition Literature Guide.pdf", tag: "notes", size: "1.1 MB" },
          { name: "Thesis Statement & Proposal Writing.pdf", tag: "summary", size: "820 KB" },
          { name: "Sample Term Paper Framework.pdf", tag: "notes", size: "440 KB" }
        ]
      }
    ];

    function renderModules(items) {
      const container = document.getElementById('modulesList');
      container.innerHTML = '';
      items.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModule(m);
        card.innerHTML = `
          <div class="card-left">
            <div class="icon-box">${m.icon}</div>
            <div>
              <div class="title">${m.name}</div>
              <div class="count">${m.files.length} verified documents</div>
            </div>
          </div>
          <div class="arrow">→</div>
        `;
        container.appendChild(card);
      });
    }

    function filterModules() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = S5_MODULES.filter(m => 
        m.name.toLowerCase().includes(query) ||
        m.files.some(f => f.name.toLowerCase().includes(query))
      );
      renderModules(filtered);
    }

    function openModule(m) {
      document.getElementById('modTitle').innerText = `${m.icon} ${m.name}`;
      document.getElementById('modSubtitle').innerText = `${m.files.length} verified study files`;
      document.getElementById('detailView').style.display = 'block';
      document.getElementById('mainView').style.display = 'none';

      const list = document.getElementById('lessonsList');
      list.innerHTML = '';
      m.files.forEach(f => {
        const el = document.createElement('div');
        el.className = 'file-item';
        el.innerHTML = `
          <div style="max-width: 75%;">
            <div style="font-size: 14px; font-weight: 600; margin-bottom: 4px; word-break: break-word;">${f.name}</div>
            <div style="display: flex; gap: 6px; align-items: center;">
              <span class="file-tag">${f.tag}</span>
              <span style="font-size: 11px; color: var(--text-sub);">${f.size}</span>
            </div>
          </div>
          <button class="get-btn" onclick="requestFile('${m.slug}', '${f.name}')">Download</button>
        `;
        list.appendChild(el);
      });
    }

    function closeDetails() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('mainView').style.display = 'block';
    }

    function requestFile(slug, fileName) {
      if (tg) {
        tg.sendData(JSON.stringify({ action: "download", module: slug, file: fileName }));
        tg.close();
      } else {
        alert("Available directly in the Telegram Bot under: " + slug);
      }
    }

    renderModules(S5_MODULES);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLSHM S5 • Literature Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/pdf.js"></script>
  <script src="js/pdf_viewer.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
  </script>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff4b2b;
      --accent-grad: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text-main);
      padding: 20px 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header { margin-bottom: 20px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; background: var(--accent-grad); color: #fff;
      padding: 4px 10px; border-radius: 20px; margin-bottom: 10px;
    }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.6px; }
    p.sub { font-size: 14px; color: var(--text-sub); margin-top: 4px; line-height: 1.4; }

    .search-box {
      width: 100%; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border); border-radius: 14px;
      padding: 12px 16px; color: #fff; font-size: 14px; font-family: inherit;
      margin-bottom: 16px; outline: none;
    }
    .search-box:focus { border-color: rgba(255, 75, 43, 0.5); }

    .grid { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 16px; display: flex; align-items: center;
      justify-content: space-between; backdrop-filter: blur(20px);
      transition: all 0.2s ease; cursor: pointer;
    }
    .card:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.08); }
    .card-left { display: flex; align-items: center; gap: 14px; }
    .icon-box {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .title { font-size: 15px; font-weight: 600; }
    .count { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
    .arrow { color: #64748b; font-size: 16px; font-weight: 700; }

    #detailView {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 100; padding: 20px 16px;
      display: none; overflow-y: auto;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      color: var(--text-main); padding: 8px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 20px;
    }
    .file-item {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 14px; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }
    .file-tag {
      font-size: 10px; padding: 2px 8px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.08); color: #cbd5e1;
      text-transform: uppercase; font-weight: 600;
    }
    .get-btn {
      background: var(--accent-grad); border: none; color: #fff;
      padding: 6px 14px; border-radius: 8px; font-size: 12px;
      font-weight: 700; cursor: pointer;
    }

    /* ===== Flipbook Viewer ===== */
    #flipbookView {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 200; padding: 0; margin: 0;
      display: none; overflow: hidden;
    }
    .flipbook-header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; z-index: 10; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    .flipbook-title { font-size: 16px; font-weight: 700; color: #fff; }
    .flipbook-close {
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border);
      color: #fff; width: 36px; height: 36px; border-radius: 10px;
      font-size: 18px; cursor: pointer;
    }
    .page-container {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90vw; max-width: 500px; height: 95vh; max-height: 700px;
      perspective: 1200px; perspective-origin: center;
    }
    .page {
      position: absolute; width: 100%; height: 100%;
      transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .page-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #fff;
    }
    .page-shadow {
      position: absolute; bottom: -5px; left: 0; width: 100%; height: 10px;
      background: rgba(0,0,0,0.3); border-radius: 50%; filter: blur(2px);
      opacity: 0.5;
    }
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border);
      color: #fff; display: flex; align-items: center;
      justify-content: center; font-size: 18px; cursor: pointer; z-index: 5;
    }
    .nav-prev { left: -60px; }
    .nav-next { right: -60px; }
    .page-indicator {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 14px; padding: 8px 16px;
      background: rgba(0,0,0,0.3); border-radius: 20px;
    }
  </style>
</head>
<body>
  <div id="mainView">
    <header class="header">
      <div class="badge">FLSHM Semester 5</div>
      <h1>Literature Library</h1>
      <p class="sub">Verified lecture summaries, novels, & exam archives.</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="Search module or material..." oninput="filterModules()" />

    <div class="grid" id="modulesList"></div>
  </div>

  <div id="detailView">
    <button class="back-btn" onclick="closeDetails()">← Back to Modules</button>
    <header class="header">
      <h1 id="modTitle">Module Title</h1>
      <p class="sub" id="modSubtitle">Verified resources</p>
    </header>
    <div class="grid" id="lessonsList"></div>
  </div>

  <!-- Flipbook Viewer -->
  <div id="flipbookView">
    <div class="flipbook-header">
      <span class="flipbook-title" id="flipbookTitle">Document</span>
      <span class="flipbook-close" onclick="closeFlipbook()">✕</span>
    </div>
    <div class="page-container" id="pageContainer">
      <canvas class="page-canvas" id="pageCanvas"></canvas>
      <div class="page-shadow"></div>
      <div class="nav-btn nav-prev" onclick="prevPage()">‹</div>
      <div class="nav-btn nav-next" onclick="nextPage()">›</div>
      <div class="page-indicator" id="pageIndicator">Page 1</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    // ===== Fetch Modules from books.json (single source of truth) =====
    // This keeps the web app in sync with the bot's books.json registry.
    // Falls back to the embedded S5_MODULES if the fetch fails (offline mode).
    const S5_MODULES = [
      {
        slug: "19th_century_literature",
        name: "19th Century Literature",
        icon: "📚",
        bookId: "19th-century-literature",
        files: [
          { name: "19th Century Literature — Core Notes", pdf: "pdfs/19th-century-literature-notes.pdf", size: "2.1 MB", bookId: "19th-century-literature" },
          { name: "Gothic Elements in Victorian Fiction", pdf: "pdfs/19th-century-literature-notes.pdf", size: "1.4 MB", bookId: "19th-century-literature" },
          { name: "19th Century Literature — Past Exam Questions", pdf: "pdfs/19th-century-literature-notes.pdf", size: "480 KB", bookId: "19th-century-literature" }
        ]
      },
      {
        slug: "cultural_studies",
        name: "Cultural Studies",
        icon: "📖",
        bookId: "cultural-studies",
        files: [
          { name: "The SAGE Dictionary of Cultural Studies", pdf: "pdfs/SAGE-Dictionary-Cultural-Studies-Barker.pdf", size: "930 KB", bookId: "sage-cultural-studies" },
          { name: "Cultural Studies and its Theoretical Legacies", pdf: "pdfs/Stuart-Hall-Cultural-Studies-Theoretical-Legacies.pdf", size: "7.4 MB", bookId: "stuart-hall-cultural-studies" },
          { name: "Cultural Studies — Core Module Guide", pdf: "pdfs/cultural-studies-sample.pdf", size: "1.2 MB", bookId: "cultural-studies" }
        ]
      },
      {
        slug: "applied_linguistics",
        name: "APPLIED LINGUISTICS",
        icon: "🔤",
        bookId: "applied-linguistics",
        files: [
          { name: "Applied Linguistics — Lecture Summaries", pdf: "pdfs/applied-linguistics-notes.pdf", size: "2.3 MB", bookId: "applied-linguistics" },
          { name: "TESOL Methodology & Classroom Practice", pdf: "pdfs/applied-linguistics-notes.pdf", size: "1.8 MB", bookId: "applied-linguistics" },
          { name: "Applied Linguistics — Midterm Questions", pdf: "pdfs/applied-linguistics-notes.pdf", size: "520 KB", bookId: "applied-linguistics" }
        ]
      },
      {
        slug: "advanced_research_techniques",
        name: "ADVANCED RESEARCH TECHNIQUES",
        icon: "🔍",
        bookId: "advanced-research-techniques",
        files: [
          { name: "Research Methods Handbook", pdf: "pdfs/advanced-research-techniques-notes.pdf", size: "1.9 MB", bookId: "advanced-research-techniques" },
          { name: "MLA 9th Edition — Complete Guide", pdf: "pdfs/advanced-research-techniques-notes.pdf", size: "1.1 MB", bookId: "advanced-research-techniques" },
          { name: "Sample Thesis Proposal Framework", pdf: "pdfs/advanced-research-techniques-notes.pdf", size: "380 KB", bookId: "advanced-research-techniques" }
        ]
      },
      {
        slug: "general_linguistics",
        name: "General Linguistics",
        icon: "🎭",
        bookId: "general-linguistics",
        files: [
          { name: "General Linguistics — Phonetics & Phonology", pdf: "pdfs/general-linguistics-notes.pdf", size: "1.7 MB", bookId: "general-linguistics" },
          { name: "Morphology & Syntax — Lecture Notes", pdf: "pdfs/general-linguistics-notes.pdf", size: "1.3 MB", bookId: "general-linguistics" },
          { name: "General Linguistics — Review Questions", pdf: "pdfs/general-linguistics-notes.pdf", size: "450 KB", bookId: "general-linguistics" }
        ]
      }
    ];

    async function loadModules() {
      try {
        const resp = await fetch('data/books.json');
        const data = await resp.json();
        const books = data.books || [];
        // Group books by their first category into module-level sections
        const categories = {};
        books.forEach(b => {
          (b.categories || []).forEach(cat => {
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(b);
          });
        });
        // Build module list from categories matching S5_MODULES order
        const moduleOrder = ["19th Century Literature", "Cultural Studies", "APPLIED LINGUISTICS", "ADVANCED RESEARCH TECHNIQUES", "General Linguistics"];
        const icons = { "19th Century Literature": "📚", "Cultural Studies": "📖", "APPLIED LINGUISTICS": "🔤", "ADVANCED RESEARCH TECHNIQUES": "🔍", "General Linguistics": "🎭" };
        const built = [];
        moduleOrder.forEach(modName => {
          const icon = icons[modName] || "📄";
          const bookIds = books.filter(b => (b.categories || []).includes(modName)).map(b => b.id);
          if (bookIds.length > 0) {
            const files = books.filter(b => bookIds.includes(b.id)).map(b => ({
              name: b.title,
              pdf: b.pdf,
              size: b.size || "—",
              bookId: b.id
            }));
            built.push({ slug: modName.toLowerCase().replace(/ /g, '_'), name: modName, icon, bookId: bookIds[0], files });
          }
        });
        if (built.length > 0) return built;
      } catch (e) {
        console.warn('Could not fetch books.json, using embedded modules:', e);
      }
      return S5_MODULES;
    }

    // ===== PDF.js State =====
    let pdfDoc = null;
    let currentPage = 1;
    let pageCount = 0;
    let pageRendering = false;
    let pageNumPending = null;
    const scale = 1.5;

    // ===== Module Navigation =====
    function renderModules(items) {
      const container = document.getElementById('modulesList');
      container.innerHTML = '';
      items.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModule(m);
        card.innerHTML = `
          <div class="card-left">
            <div class="icon-box">${m.icon}</div>
            <div>
              <div class="title">${m.name}</div>
              <div class="count">${m.files.length} verified documents</div>
            </div>
          </div>
          <div class="arrow">→</div>
        `;
        container.appendChild(card);
      });
    }

    let loadedModules = S5_MODULES;

    function filterModules() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = loadedModules.filter(m =>
        m.name.toLowerCase().includes(query) ||
        m.files.some(f => f.name.toLowerCase().includes(query))
      );
      renderModules(filtered);
    }

    function openModule(m) {
      document.getElementById('modTitle').innerText = `${m.icon} ${m.name}`;
      document.getElementById('modSubtitle').innerText = `${m.files.length} verified study files`;
      document.getElementById('detailView').style.display = 'block';
      document.getElementById('mainView').style.display = 'none';

      const list = document.getElementById('lessonsList');
      list.innerHTML = '';
      m.files.forEach(f => {
        const el = document.createElement('div');
        el.className = 'file-item';
        el.innerHTML = `
          <div style="max-width: 75%;">
            <div style="font-size: 14px; font-weight: 600; margin-bottom: 4px; word-break: break-word;">${f.name}</div>
            <div style="font-size: 11px; color: var(--text-sub);">${f.size}</div>
          </div>
          <button class="get-btn" onclick="openFlipbook('${f.pdf}', '${f.name}')">Read</button>
        `;
        list.appendChild(el);
      });
    }

    function closeDetails() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('mainView').style.display = 'block';
    }

    // ===== Flipbook Viewer Functions =====
    function openFlipbook(pdfPath, title) {
      document.getElementById('detailView').style.display = 'none';
      const fb = document.getElementById('flipbookView');
      fb.style.display = 'block';
      document.getElementById('flipbookTitle').innerText = title;
      loadPdf(pdfPath);
    }

    function closeFlipbook() {
      const fb = document.getElementById('flipbookView');
      fb.style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      if (pdfDoc) {
        pdfDoc.destroy();
        pdfDoc = null;
      }
    }

    function loadPdf(pdfPath) {
      const loadingTask = pdfjsLib.getDocument(pdfPath);
      loadingTask.promise.then(pdf => {
        pdfDoc = pdf;
        pageCount = pdf.numPages;
        currentPage = 1;
        renderPage();
      }).catch(err => {
        console.error('Error loading PDF:', err);
        alert('Failed to load document. Please try again.');
        closeFlipbook();
      });
    }

    function renderPage() {
      if (pageRendering) {
        pageNumPending = currentPage;
        return;
      }

      const renderNextPage = (num) => {
        pageRendering = true;
        const canvas = document.getElementById('pageCanvas');
        const ctx = canvas.getContext('2d');

        pdfDoc.getPage(num).then(page => {
          const viewport = page.getViewport({ scale: scale });
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.width = '100%';
          canvas.style.height = '100%';

          const renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };
          page.render(renderContext).promise.then(() => {
            pageRendering = false;
            currentPage = num;
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} / ${pageCount}`;
            canvas.classList.add('loaded');

            if (pageNumPending !== null) {
              renderNextPage(pageNumPending);
              pageNumPending = null;
            }
          });
        });
      };

      renderNextPage(currentPage);
    }

    function nextPage() {
      if (currentPage < pageCount) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('flipbookView').style.display === 'block') {
        if (e.key === 'ArrowLeft') prevPage();
        if (e.key === 'ArrowRight') nextPage();
        if (e.key === 'Escape') closeFlipbook();
      }
    });

    // Touch swipe
    let touchStartX = 0;
    let touchEndX = 0;
    const pageContainer = document.getElementById('pageContainer');
    pageContainer.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);
    pageContainer.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      if (document.getElementById('flipbookView').style.display === 'block') {
        if (touchEndX < touchStartX - 50) nextPage();
        if (touchEndX > touchStartX + 50) prevPage();
      }
    }, false);

    // Pinch-to-zoom
    let currentZoom = 1;
    pageContainer.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        currentZoom = Math.max(0.5, Math.min(2.5, currentZoom * delta));
        const canvas = document.getElementById('pageCanvas');
        canvas.style.transform = `scale(${currentZoom})`;
      }
    }, { passive: false });

    // ===== Auto-Open Flipbook from ?book=<id> Query Parameter =====
    // When a student clicks a PDF button in the Telegram bot, the WebAppInfo
    // URL opens this page with ?book=<book_id>. We auto-select the matching
    // module's first PDF and open the flipbook viewer immediately.
    function handleBookParam(modules) {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      if (!bookId) return;

      // Find the module+file matching this book_id
      for (const mod of modules) {
        const match = mod.files.find(f => f.bookId === bookId);
        if (match) {
          // Hide main/detail views, go straight to flipbook
          document.getElementById('mainView').style.display = 'none';
          document.getElementById('detailView').style.display = 'none';
          const fb = document.getElementById('flipbookView');
          fb.style.display = 'block';
          document.getElementById('flipbookTitle').innerText = match.name;
          loadPdf(match.pdf);
          return;
        }
      }
    }

    // Initialize: load modules dynamically then check for ?book= param
    (async () => {
      loadedModules = await loadModules();
      renderModules(loadedModules);
      handleBookParam(loadedModules);
    })();
  </script>
</body>
</html>
